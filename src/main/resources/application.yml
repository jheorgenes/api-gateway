# Porta normalmente padrão para api-gateway 8765
server:
  port: 8765
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
spring:
  application:
    name: api-gateway
  # Configuração das rotas do API Gateway utilizando WebFlux.
  # O prefixo lb:// utiliza o Spring Cloud LoadBalancer para localizar
  # as instâncias dos microsserviços registradas no Eureka.
  cloud:
    gateway:
      server:
        webflux:

#           discovery:
#             locator:
#               enabled: true
#               lower-case-service-id: true
          routes:
            - id: book-service
              uri: lb://book-service
              predicates:
                - Path=/book-service/**
            - id: exchange-service
              uri: lb://exchange-service
              predicates:
                - Path=/exchange-service/**
#          # Pega a configuração local dos microsserviços
#          discovery:
#            locator:
#              enabled: true
#              lower-case-service-id: true

# Configuração para o Zipkin
management:
  tracing:
    sampling:
      probability: 1.0
zipkin:
  base-url: http://localhost:9411

# Alterando o caminho de acesso aos microsserviços ao swagger
springdoc:
  swagger-ui:
    urls:
      - name: book-service
        url: /book-service/v3/api-docs
      - name: exchange-service
        url: /exchange-service/v3/api-docs
