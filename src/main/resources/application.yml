# Porta normalmente padrão para api-gateway 8765
server:
  port: 8765
spring:
  application:
    name: api-gateway
# Habilitando comunicação com outros microsserviços através desse.
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true